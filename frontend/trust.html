<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Data handling</title>
<!--
  3.0 "Your data, provably": the optional public data handling page, /trust. Off unless a platform
  admin switches it on (Platform -> Data & privacy). Filled by /js/trust-page.js from
  /api/public/trust, an allowlist of non-sensitive facts (lib/trust/report.js publicView), through
  textContent and esc(). Printable: the print stylesheet below is for procurement packs.
-->
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --border:#dde1e7; --text:#14171c; --muted:#5d6673; --ok:#1b7f45; --warn:#a15c00; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1115; --card:#1a1d24; --border:#2c313b; --text:#e8eaed; --muted:#9aa0aa; --ok:#3ddc84; --warn:#f5b041; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:28px 16px 56px; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }
  h1 { font-size:26px; line-height:1.2; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:14px; break-inside:avoid; }
  h2 { font-size:17px; margin:0 0 10px; }
  dl { display:grid; grid-template-columns:minmax(150px, 240px) 1fr; gap:6px 16px; margin:0; }
  dt { color:var(--muted); }
  dd { margin:0; }
  table { width:100%; border-collapse:collapse; }
  td { padding:6px 0; border-bottom:1px solid var(--border); vertical-align:top; }
  td + td { padding-left:12px; }
  .statement { border-left:4px solid var(--ok); }
  .statement.leaves { border-left-color:var(--warn); }
  .statement strong { font-size:18px; display:block; margin-bottom:4px; }
  .muted { color:var(--muted); font-size:13px; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; white-space:nowrap; }
  ul { margin:0; padding-left:20px; }
  @media (max-width:600px) { dl { grid-template-columns:1fr; } dt { margin-top:6px; } header { flex-direction:column; } }
  @media print {
    :root { --bg:#fff; --card:#fff; --text:#000; --muted:#444; --border:#bbb; }
    body { font-size:11pt; }
    .wrap { max-width:none; padding:0; }
    .no-print { display:none !important; }
    .card { border:1px solid #bbb; border-radius:0; page-break-inside:avoid; }
    a { color:#000; text-decoration:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Data handling</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <button type="button" class="no-print" id="printBtn">Print</button>
  </header>
  <main id="root" aria-live="polite"></main>
  <p class="muted" id="footer"></p>
</div>
<script type="module" src="/js/trust-page.js"></script>
</body>
</html>
